<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soma</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #2C1A0E 0%, #5C3317 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 16px;
    }
    .splash-icon { font-size: 80px; animation: bloom 1.5s ease-in-out infinite; }
    @keyframes bloom {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: 0.85; }
    }
    h1 {
      font-family: Georgia, serif;
      font-size: 36px;
      color: #F5C842;
      letter-spacing: 6px;
    }
    p {
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #C8B8A2;
      letter-spacing: 3px;
    }
  </style>
</head>
<body>
  <div class="splash-icon">🪷</div>
  <h1>SOMA</h1>
  <p>AYURVEDIC PERIOD TRACKING</p>
</body>
</html>
